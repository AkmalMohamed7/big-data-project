<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGoogle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #23232d 0%, #15151c 60%, #0f0f14 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e6e8ef; }
        .container { text-align: center; width: 100%; max-width: 620px; padding: 28px 24px; }
        h1 { font-size: 52px; letter-spacing: -1px; color: #f5f7ff; margin-bottom: 10px; font-weight: 700; }
        h1 span { color: #7c8cff; }
        p { color: #a3a8bf; margin-bottom: 32px; font-size: 15px; }
        .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 12px 18px; backdrop-filter: blur(14px); }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 16px; color: #f5f7ff; background: transparent; }
        .search-bar input::placeholder { color: #8f95ae; }
        /* .mic-btn { background: none; border: none; cursor: pointer; font-size: 18px; margin-right: 10px; color: #9fa4ba; transition: all 0.2s ease; }
        .mic-btn:hover { color: #d9ddff; }
        .mic-btn.listening { color: #ff6b6b; animation: pulse 1s infinite; } */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .search-btn { background: #7c8cff; color: white; border: none; border-radius: 999px; padding: 10px 22px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
        .search-btn:hover { background: #6876f0; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mini<span>Google</span></h1>
        <p>Big Data Search Engine</p>
        <form action="/search" method="get">
            <div class="search-bar">
                <input type="text" name="q" id="searchInput" placeholder="Search for anything..." autofocus>
                <!-- <button type="button" class="mic-btn" id="micBtn" title="Voice Search">🎤</button> -->
                <button type="submit" class="search-btn">Search</button>
            </div>
        </form>
    </div>
